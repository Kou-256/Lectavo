[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "release",
    "movie_slide_notes/.venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
